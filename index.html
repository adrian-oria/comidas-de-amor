<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#c0344a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Comidas de amor"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <title>Comidas de amor ❤️</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rose: #c0344a; --rose-light: #fdf0f2; --rose-mid: #f5c2cc; --rose-dark: #8a1f32;
      --weekend-bg: #EBF2FB; --weekend-border: #B5D4F4; --weekend-text: #185FA5;
      --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede9;
      --text: #1a1a18; --text2: #6b6b68; --text3: #9b9b98;
      --border: rgba(26,26,24,0.15); --border2: rgba(26,26,24,0.3);
      --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --bg2: #2a2a28; --bg3: #323230;
        --text: #f0efe9; --text2: #9b9b98; --text3: #6b6b68;
        --border: rgba(240,239,233,0.15); --border2: rgba(240,239,233,0.3);
        --weekend-bg: #1a2433; --weekend-border: #2a4060; --weekend-text: #7ab0e0;
        --rose-light: #3a1f25; --rose-mid: #6a2c3a; --rose-dark: #f5c2cc;
      }
    }
    html, body { min-height: 100%; background: var(--bg3); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
    .muted { color: var(--text3); font-size: 14px; padding: 12px 0; }
    .hint { font-size: 12px; color: var(--text3); text-align: center; margin-top: 10px; }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }
    .loading-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 48px; }

    /* ── LOGIN / VERIFY ── */
    .login-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; text-align: center; }
    .login-logo { font-size: 64px; margin-bottom: 12px; }
    .login-title { font-size: 26px; font-weight: 600; color: var(--rose); margin-bottom: 6px; }
    .login-sub { font-size: 15px; color: var(--text2); margin-bottom: 36px; }
    .login-card { width: 100%; max-width: 340px; background: var(--bg); border-radius: var(--radius); border: 0.5px solid var(--border2); padding: 24px; margin-top: 16px; }
    .login-tabs { display: flex; margin-bottom: 20px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; }
    .login-tab { flex: 1; padding: 9px 0; border: none; background: transparent; font-size: 14px; color: var(--text2); }
    .login-tab.active { background: var(--rose); color: #fff; font-weight: 500; }
    .login-info { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 16px; text-align: left; word-break: break-word; }
    .field { margin-bottom: 12px; text-align: left; }
    .field label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 5px; }
    .field input { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg2); font-size: 16px; outline: none; }
    .field input:focus { border-color: var(--rose); }
    .btn-primary { width: 100%; padding: 13px; border-radius: var(--radius-sm); background: var(--rose); color: #fff; border: none; font-size: 15px; font-weight: 500; margin-top: 4px; }
    .btn-primary:active { background: var(--rose-dark); }
    .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.6; cursor: default; }
    .btn-secondary { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; font-size: 15px; margin-top: 8px; }
    .login-error { font-size: 13px; color: var(--rose); margin-top: 10px; min-height: 18px; text-align: center; }
    .login-forgot { font-size: 13px; color: var(--text3); margin-top: 14px; background: none; border: none; width: 100%; text-align: center; }

    /* ── HOME ── */
    .home-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 80px; }
    .home-header { display: flex; align-items: center; justify-content: space-between; padding: 24px 0 20px; }
    .home-title { font-size: 22px; font-weight: 600; color: var(--rose); }
    .avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--rose-light); border: 1.5px solid var(--rose-mid); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: var(--rose); }
    .cal-card { width: 100%; text-align: left; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
    .cal-card:active { background: var(--bg2); }
    .cal-icon { font-size: 28px; flex-shrink: 0; }
    .cal-info { flex: 1; min-width: 0; }
    .cal-name { font-size: 16px; font-weight: 500; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-meta { font-size: 12px; color: var(--text3); }
    .cal-arrow { font-size: 20px; color: var(--text3); }
    .btn-new-cal { width: 100%; padding: 14px; border-radius: var(--radius); border: 1.5px dashed var(--border2); background: transparent; font-size: 15px; color: var(--text2); margin-top: 8px; }
    .btn-new-cal:active { background: var(--bg2); }
    .empty-state { text-align: center; padding: 48px 0 24px; }
    .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; color: var(--text2); margin-bottom: 4px; }
    .empty-state small { font-size: 13px; color: var(--text3); }

    /* ── APP ── */
    .app-wrap { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }
    .app-header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
    .btn-back { background: none; border: none; font-size: 22px; color: var(--text2); padding: 4px; line-height: 1; }
    .app-header-info { flex: 1; min-width: 0; }
    .app-title { font-size: 17px; font-weight: 600; color: var(--rose); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sync-status { font-size: 11px; display: flex; align-items: center; gap: 4px; color: var(--text3); margin-top: 2px; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #5DCAA5; flex-shrink: 0; }
    .sync-dot.offline { background: #F09595; }
    .sync-dot.syncing { background: #FAC775; }
    .btn-settings { background: none; border: none; font-size: 20px; color: var(--text2); padding: 4px; }
    .tabs { display: flex; gap: 6px; padding: 8px 16px 0; }
    .tab { flex: 1; padding: 9px 0; border-radius: var(--radius); border: 0.5px solid var(--border2); background: transparent; font-size: 13px; color: var(--text2); }
    .tab.active { background: var(--rose); color: #fff; font-weight: 500; border-color: var(--rose); }
    .section { display: none; padding: 12px 16px 0; }
    .section.active { display: block; }

    /* ── SEMANA / MES ── */
    .week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .week-nav button { width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--bg); font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .week-nav button:active { background: var(--bg2); }
    .week-label { font-size: 14px; font-weight: 500; flex: 1; text-align: center; }
    .today-btn { display: block; margin: 0 auto 12px; padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--rose-mid); background: var(--rose-light); color: var(--rose-dark); font-size: 13px; }
    .day-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
    .day-card.today { border-left: 3px solid var(--rose); }
    .day-card.weekend { background: var(--weekend-bg); border-color: var(--weekend-border); }
    .day-name { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
    .day-card.weekend .day-name { color: var(--weekend-text); }
    .today-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); display: inline-block; }
    .meal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .meal-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
    .meal-slot { width: 100%; text-align: left; border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; gap: 3px; background: var(--bg); }
    .meal-slot:active { background: var(--bg2); }
    .meal-slot.filled { flex-direction: row; align-items: center; gap: 4px; padding: 0 2px 0 0; }
    .meal-slot.filled:active { background: var(--bg); }
    .meal-main { flex: 1; min-width: 0; min-height: 50px; background: none; border: none; text-align: left; padding: 8px 0 8px 10px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
    .meal-main:active { opacity: 0.6; }
    .meal-name { font-size: 13px; line-height: 1.3; word-break: break-word; }
    .meal-empty-text { font-size: 13px; color: var(--text3); }
    .meal-clear { background: none; border: none; font-size: 16px; color: var(--text3); padding: 8px 6px; line-height: 1; flex-shrink: 0; }
    .meal-accompaniment { font-size: 11px; color: var(--text3); font-style: italic; }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
    .badge-comida { background: #E6F1FB; color: #0C447C; }
    .badge-cena { background: #EEEDFE; color: #3C3489; }
    .badge-ambos { background: #EAF3DE; color: #27500A; }
    .month-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(44px,1fr)); gap: 4px; min-width: 320px; }
    .month-hdr { font-size: 11px; font-weight: 600; color: var(--text3); text-align: center; padding-bottom: 6px; text-transform: uppercase; }
    .month-hdr.wknd { color: var(--weekend-text); }
    .month-day { display: block; width: 100%; text-align: left; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 5px; min-height: 58px; min-width: 0; overflow: hidden; }
    .month-day:active { background: var(--bg2); }
    .month-day.blank { opacity: 0.2; }
    .month-day.today { border-color: var(--rose); border-width: 1.5px; }
    .month-day.weekend { background: var(--weekend-bg); border-color: var(--weekend-border); }
    .month-day-num { display: block; font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 3px; text-align: center; }
    .month-day.weekend .month-day-num { color: var(--weekend-text); }
    .month-meal { display: block; font-size: 9px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .month-meal b { font-size: 8px; color: var(--rose); font-weight: 600; }

    /* ── PLATOS ── */
    .list-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; font-size: 13px; color: var(--text2); }
    .filter-btn.active { background: var(--rose); color: #fff; border-color: var(--rose); }
    .add-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .add-row input, .add-row select { padding: 9px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); font-size: 16px; }
    .add-row input { flex: 1; min-width: 120px; }
    .add-row button { padding: 9px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; font-size: 13px; white-space: nowrap; }
    .dish-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 7px; }
    .dish-info { flex: 1; min-width: 0; }
    .dish-name-row { font-size: 14px; margin-bottom: 4px; word-break: break-word; }
    .dish-name-row .badge { margin-right: 6px; }
    .dish-acc-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .acc-tag { font-size: 11px; padding: 2px 4px 2px 8px; border-radius: 20px; background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); display: flex; align-items: center; gap: 2px; }
    .acc-tag button { background: none; border: none; font-size: 11px; color: var(--text3); padding: 2px 4px; }
    .acc-add-row { display: flex; gap: 5px; margin-top: 6px; }
    .acc-add-row input { flex: 1; min-width: 0; padding: 5px 8px; font-size: 16px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); }
    .acc-add-row button { padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; }
    .dish-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
    .dish-del, .acc-toggle { background: none; border: none; font-size: 12px; color: var(--text3); white-space: nowrap; padding: 2px 0; }

    /* ── AJUSTES ── */
    .settings-label { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; margin-top: 20px; }
    .settings-label:first-child { margin-top: 0; }
    .settings-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
    .settings-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 0.5px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-icon { font-size: 18px; flex-shrink: 0; }
    .settings-row-info { flex: 1; min-width: 0; }
    .settings-row-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .settings-row-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .settings-row-action { font-size: 13px; color: var(--rose); background: none; border: none; padding: 0; flex-shrink: 0; }
    .invite-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .invite-row input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); font-size: 16px; }
    .invite-row button { padding: 10px 16px; border-radius: var(--radius-sm); background: var(--rose); color: #fff; border: none; font-size: 14px; white-space: nowrap; }
    .danger-btn { width: 100%; padding: 13px; border-radius: var(--radius); border: 0.5px solid #F09595; background: transparent; color: var(--rose); font-size: 15px; }

    /* ── OVERLAYS ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    #acc-modal { z-index: 110; }
    .sheet { background: var(--bg); border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 540px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border2); margin: 10px auto 4px; flex-shrink: 0; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 10px; flex-shrink: 0; gap: 8px; }
    .sheet-header h3 { font-size: 16px; font-weight: 600; }
    .sheet-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .sheet-close { background: none; border: none; font-size: 22px; color: var(--text2); line-height: 1; padding: 4px; }
    .sheet-body { padding: 16px; }
    .sheet-body label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; }
    .sheet-body input { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg2); font-size: 16px; margin-bottom: 16px; outline: none; }
    .sheet-body input:focus { border-color: var(--rose); }
    .modal-search-wrap { padding: 0 16px 10px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .modal-search-wrap input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg2); font-size: 16px; }
    .modal-list { overflow-y: auto; flex: 1; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; }
    .modal-dish { width: 100%; padding: 12px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px; background: none; border: none; text-align: left; }
    .modal-dish:active { background: var(--bg2); }
    .modal-dish.current { background: var(--rose-light); }
    .modal-dish-name { font-size: 15px; flex: 1; }
    .modal-dish-extra { font-size: 11px; color: var(--text3); }
    .modal-dish-new { color: var(--rose); font-size: 14px; }
    .acc-modal-hint { font-size: 12px; color: var(--text3); padding: 2px 16px 10px; }
    .acc-modal-list { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .acc-modal-item { padding: 10px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); font-size: 14px; background: var(--bg); }
    .acc-modal-item.selected { background: var(--rose-light); border-color: var(--rose-mid); color: var(--rose-dark); font-weight: 500; }
    .acc-modal-confirm { margin: 0 16px 16px; display: flex; gap: 8px; }
    .acc-modal-confirm button { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); font-size: 14px; background: transparent; }
    .acc-modal-confirm button.primary { background: var(--rose); color: #fff; border-color: var(--rose); }
    .usermenu-user { padding: 16px; border-bottom: 0.5px solid var(--border); }
    .usermenu-email { font-size: 15px; word-break: break-all; }
    .usermenu-btn { width: 100%; padding: 14px 16px; text-align: left; background: none; border: none; font-size: 15px; color: var(--rose); }

    .toast { position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; }
  </style>
  <script type="module" src="app.js"></script>
</head>
<body>

<!-- CARGANDO -->
<div id="screen-loading" class="screen active"><div class="loading-wrap">🍽️</div></div>

<!-- LOGIN -->
<main id="screen-login" class="screen">
  <div class="login-wrap">
    <div class="login-logo">🍽️</div>
    <div class="login-title">Comidas de amor ❤️</div>
    <div class="login-sub">Nuestro menú semanal</div>
    <div class="login-card">
      <div class="login-tabs" role="tablist">
        <button type="button" class="login-tab active" role="tab" aria-selected="true" data-action="login-tab" data-tab="login">Entrar</button>
        <button type="button" class="login-tab" role="tab" aria-selected="false" data-action="login-tab" data-tab="register">Registrarse</button>
      </div>
      <form id="login-form" data-form="login" novalidate>
        <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" name="email" placeholder="tu@email.com" autocomplete="email" required/></div>
        <div class="field"><label for="login-pass">Contraseña</label><input type="password" id="login-pass" name="password" placeholder="••••••••" autocomplete="current-password" required/></div>
        <button type="submit" class="btn-primary">Entrar</button>
        <button type="button" class="login-forgot" data-action="reset-pass">¿Olvidaste tu contraseña?</button>
      </form>
      <form id="register-form" data-form="register" novalidate hidden>
        <div class="field"><label for="reg-email">Email</label><input type="email" id="reg-email" name="email" placeholder="tu@email.com" autocomplete="email" required/></div>
        <div class="field"><label for="reg-pass">Contraseña</label><input type="password" id="reg-pass" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required/></div>
        <button type="submit" class="btn-primary">Crear cuenta</button>
      </form>
      <div class="login-error" id="login-error" role="alert"></div>
    </div>
  </div>
</main>

<!-- VERIFICAR EMAIL -->
<main id="screen-verify" class="screen">
  <div class="login-wrap">
    <div class="login-logo">✉️</div>
    <div class="login-title">Verifica tu email</div>
    <div class="login-card">
      <p class="login-info">Te hemos enviado un enlace a <strong id="verify-email"></strong>. Ábrelo y después pulsa el botón de abajo. Revisa también la carpeta de spam.</p>
      <button type="button" class="btn-primary" data-action="verify-check">Ya lo he verificado</button>
      <button type="button" class="btn-secondary" data-action="verify-resend">Reenviar email</button>
      <button type="button" class="login-forgot" data-action="logout">Cerrar sesión</button>
    </div>
  </div>
</main>

<!-- HOME -->
<main id="screen-home" class="screen">
  <div class="home-wrap">
    <header class="home-header">
      <h1 class="home-title">Comidas de amor ❤️</h1>
      <button type="button" class="avatar-btn" id="home-avatar" data-action="open-usermenu" aria-label="Mi cuenta"></button>
    </header>
    <div id="cal-list"></div>
    <button type="button" class="btn-new-cal" data-action="new-cal">+ Crear nuevo calendario</button>
  </div>
</main>

<!-- APP -->
<main id="screen-app" class="screen">
  <div class="app-wrap">
    <header class="app-header">
      <button type="button" class="btn-back" data-action="go-home" aria-label="Volver">&#8592;</button>
      <div class="app-header-info">
        <h1 class="app-title" id="app-cal-name"></h1>
        <div class="sync-status"><span class="sync-dot syncing" id="sync-dot"></span><span id="sync-text">Conectando…</span></div>
      </div>
      <button type="button" class="btn-settings" data-action="tab" data-tab="ajustes" aria-label="Ajustes">⚙️</button>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" role="tab" data-action="tab" data-tab="semanal">Semana</button>
      <button type="button" class="tab" role="tab" data-action="tab" data-tab="mensual">Mes</button>
      <button type="button" class="tab" role="tab" data-action="tab" data-tab="platos">Platos</button>
      <button type="button" class="tab" role="tab" data-action="tab" data-tab="ajustes">Ajustes</button>
    </nav>
    <section id="tab-semanal" class="section active"></section>
    <section id="tab-mensual" class="section"></section>
    <section id="tab-platos" class="section"></section>
    <section id="tab-ajustes" class="section"></section>
  </div>
</main>

<!-- Modal platos -->
<div id="modal" class="overlay" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div><h3 id="modal-title">Seleccionar plato</h3><div class="sheet-sub" id="modal-sub"></div></div>
      <button type="button" class="sheet-close" data-action="close" data-target="modal" aria-label="Cerrar">&#10005;</button>
    </div>
    <div class="modal-search-wrap"><input type="search" id="modal-search" placeholder="Buscar o añadir plato..." autocomplete="off" maxlength="80" aria-label="Buscar plato"/></div>
    <div class="modal-list" id="modal-list"></div>
  </div>
</div>

<!-- Modal acompañamientos -->
<div id="acc-modal" class="overlay" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="acc-modal-title">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="acc-modal-title">Acompañamiento</h3>
      <button type="button" class="sheet-close" data-action="close" data-target="acc-modal" aria-label="Cerrar">&#10005;</button>
    </div>
    <div class="acc-modal-hint">Puedes seleccionar varios</div>
    <div class="acc-modal-list" id="acc-modal-list"></div>
    <div class="acc-modal-confirm">
      <button type="button" data-action="acc-none">Sin acompañamiento</button>
      <button type="button" class="primary" data-action="acc-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal nuevo calendario -->
<div id="newcal" class="overlay" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="newcal-title">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="newcal-title">Nuevo calendario</h3>
      <button type="button" class="sheet-close" data-action="close" data-target="newcal" aria-label="Cerrar">&#10005;</button>
    </div>
    <form class="sheet-body" data-form="new-cal">
      <label for="newcal-name">Nombre del calendario</label>
      <input type="text" id="newcal-name" name="name" maxlength="60" placeholder="Ej: Comidas de amor ❤️" required/>
      <button type="submit" class="btn-primary">Crear calendario</button>
    </form>
  </div>
</div>

<!-- Menú de usuario -->
<div id="usermenu" class="overlay" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Mi cuenta">
    <div class="sheet-handle"></div>
    <div class="usermenu-user"><div class="usermenu-email" id="usermenu-email"></div></div>
    <button type="button" class="usermenu-btn" data-action="logout">Cerrar sesión</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
