<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Migración – Comidas de amor</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; background: #f5f5f3; color: #1a1a18; }
    h2 { color: #c0344a; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; border: 0.5px solid rgba(0,0,0,0.1); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #6b6b68; margin: 12px 0 6px; }
    label.check { display: flex; gap: 8px; align-items: flex-start; color: #1a1a18; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.3); font-size: 14px; }
    textarea { font-family: monospace; font-size: 12px; }
    button { padding: 14px 24px; background: #c0344a; color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 14px; }
    button:disabled { background: #ccc; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
    .log { background: #1c1c1a; color: #5DCAA5; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; min-height: 40px; }
    [hidden] { display: none !important; }
  </style>
  <script type="module" src="migrar.js"></script>
</head>
<body>
  <h2>🍽️ Migración a la nueva estructura</h2>
  <div class="card" id="session">Comprobando sesión…</div>
  <div class="card">
    <label for="json">1. Pega aquí el JSON exportado de Firebase</label>
    <textarea id="json" rows="8" spellcheck="false" placeholder='{"dishes": [...], "menu": {...}}'></textarea>
    <label class="check"><input type="checkbox" id="shift" checked/> Corregir el desfase de fechas (+1 día). Déjalo marcado: tus datos vienen de la versión antigua.</label>
    <label for="cal-name">Nombre del calendario</label>
    <input type="text" id="cal-name" maxlength="60" value="Comidas de amor ❤️"/>
    <button id="btn-analyze" disabled>2. Analizar</button>
  </div>
  <div class="card" id="preview" hidden>
    <strong id="summary"></strong>
    <p style="margin-top:10px">Comprueba que estos días coinciden con lo que veías en la app antigua:</p>
    <table id="sample"></table>
    <button id="btn-run">3. Crear calendario migrado</button>
    <p id="done" hidden style="margin-top:12px">✅ Listo. <a href="/">Abrir la app</a> y borra migrar.html y migrar.js del repositorio.</p>
  </div>
  <div class="log" id="log"></div>
</body>
</html>
